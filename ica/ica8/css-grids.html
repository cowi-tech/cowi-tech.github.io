<head>
    <style>
        body {
            font: 1.2em / 1.5 sans-serif;
        }

        .grid > * {
            background-color: #4d7298;
            border: 2px solid #77a6b6;
            border-radius: 0.5em;
            color: white;
            padding: 0.5em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 0.5fr;
            grid-gap: 10px;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
    </div>
</body>
